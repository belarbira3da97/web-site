name: Publier le site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Enregistrer la version publiée
        run: git push origin "$GITHUB_SHA:refs/heads/pages-live" --force
